<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
</head>
<body>
    <h1>Mi primera tabla</h1>

    <table border="1">
        <tr>
            <th>Posición</th>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td rowspan="2">1°</td>
            <td>Laura Gómez</td>
            <td>9,2</td>
        </tr>
        <tr>
            <td>Ivan Martinez</td>
            <td>9,2</td>
        </tr>
    </table>
